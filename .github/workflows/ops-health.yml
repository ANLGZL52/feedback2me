name: Ops Health (read-only)

# App-independent observability. Runs PRODUCTION-SAFE READ-ONLY checks + release
# preflight. NEVER deploys, NEVER writes to production, NEVER runs synthetic
# purchases or touches user data. Results are uploaded as artifacts (NOT committed
# every run, to avoid repo bloat — Phase 19).
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # every 30 min; adjust as needed
  # NOTE: no push trigger — this is monitoring, not a build gate.

permissions:
  contents: read
  actions: read
  issues: write # for the spam-safe P0/DOWN alert (ops/monitor/alert.mjs)
  id-token: write # OIDC token for GCP Workload Identity Federation (read-only Cloud Logging); no static keys

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Dedicated read-only Postgres observability credential (NOT the app DATABASE_URL).
    # Absent -> the probe reports UNKNOWN/NO_CREDENTIAL and this workflow stays SUCCESS.
    # Masked by Actions; never echoed, never written to the summary/artifact.
    env:
      OPS_POSTGRES_DATABASE_URL: ${{ secrets.OPS_POSTGRES_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # V5 dedup continuity: incident state does NOT live in git (no contents:write).
      # Seed ops-status/incident-state.json from the previous successful run's artifact
      # so NEW/ONGOING/RESOLVED/REOPEN are tracked across scheduled runs without creating
      # duplicate Issues. Best-effort: on any miss the GitHub-side lookup fallback in
      # incident-delivery.mjs still prevents duplicates. Copies ONLY incident-state.json
      # (fresh collect/evaluate overwrite everything else this run).
      - name: Seed incident state from the last successful run (dedup continuity)
        id: seed_state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p ops-status _seed
          seed_status=missing; source_run=
          rid=$(gh run list --workflow "Ops Health (read-only)" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null)
          if [ -n "$rid" ]; then
            source_run="$rid"
            gh run download "$rid" -n ops-status -D _seed >/dev/null 2>&1
            if [ -f _seed/incident-state.json ]; then
              cp _seed/incident-state.json ops-status/incident-state.json
              seed_status=seeded
              echo "seeded incident-state.json from run $rid"
            else
              seed_status=no_state_in_artifact
              echo "no incident-state.json in run $rid artifact (first live run or pruned) — GitHub lookup fallback will guard dedup"
            fi
          else
            echo "no prior successful run found — GitHub lookup fallback will guard dedup"
          fi
          rm -rf _seed
          echo "seed_status=$seed_status" >> "$GITHUB_OUTPUT"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install ops Postgres driver (only when the direct probe is configured)
        if: env.OPS_POSTGRES_DATABASE_URL != ''
        run: npm --prefix ops install --no-audit --no-fund
      - name: Run read-only health checks
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          # FIREBASE_WEB_API_KEY optional; defaults to the public web key already in web_static/f.html
        run: node ops/monitor/run.mjs
      # Short-lived GCP credential via Workload Identity Federation (NO static key,
      # NO stored token). Runs ONLY when the (non-secret) WIF repo variables are set,
      # and ONLY authorizes because the WIF provider trusts this repo on ref=main.
      # A failure here is non-fatal: the collector then reports NOT_CONFIGURED.
      - name: GCP auth (WIF, read-only Cloud Logging — no static credentials)
        id: gcp_auth
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          # Least-privilege scope: read Cloud Logging only.
          access_token_scopes: https://www.googleapis.com/auth/logging.read
          access_token_lifetime: 300s
      - name: Collect runtime logs (Railway + GCP; read-only; NOT_CONFIGURED without creds)
        id: runtime_logs
        # continue-on-error: a collector/auth failure is NOT a backend outage and must
        # not fail the observability workflow. Missing token -> UNKNOWN/NOT_CONFIGURED.
        continue-on-error: true
        env:
          OPS_RAILWAY_TOKEN: ${{ secrets.OPS_RAILWAY_TOKEN }}
          # Ephemeral WIF access token (empty when WIF not configured/authorized) — the
          # GCP collector treats an empty token as NOT_CONFIGURED. Never persisted/printed.
          GCP_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: node ops/monitor/collect-runtime.mjs
      - name: Evaluate runtime health V3 (metrics -> SLO -> alerts -> release gate)
        id: evaluate_runtime
        # continue-on-error: the evaluator must PRODUCE evidence even when the system
        # is UNHEALTHY. A non-zero exit here would suppress the artifact/report, which
        # is the opposite of what monitoring needs. RUNTIME UNHEALTHY != COLLECTOR FAILED.
        continue-on-error: true
        run: node ops/monitor/evaluate-runtime.mjs
      - name: Ops engine self-tests
        id: engine_tests
        run: node --test ops/monitor/engine.test.mjs
      - name: Ops alert-calibration tests (runtime-only alerting)
        id: alert_tests
        run: node --test ops/monitor/alert.test.mjs
      - name: Ops preflight semantics tests (observability vs release readiness)
        id: preflight_tests
        run: node --test ops/monitor/preflight.test.mjs
      - name: Ops postgres-probe tests (sanitized; no real DB)
        id: postgres_tests
        run: node --test ops/monitor/checks/postgres-direct.test.mjs
      - name: Ops runtime-log collector tests (redaction/normalization; no network)
        id: runtimelog_tests
        run: node --test ops/monitor/checks/railway-runtime-logs.test.mjs ops/monitor/checks/railway-http-logs.test.mjs ops/monitor/checks/gcp-functions-logs.test.mjs
      - name: Ops V3 evaluator tests (SLO/alerts/release-gate/money-safety; fixtures, no network)
        id: evaluator_tests
        run: node --test ops/monitor/evaluate-runtime.test.mjs
      - name: Ops V4/V5/V6 incident + durability tests (dedup/cooldown/flapping/state/dry-run; fixtures, no network)
        id: incident_tests
        run: node --test ops/monitor/incident-delivery.test.mjs
      - name: Ops V6/V7 digest + Slack adapter + single-writer architecture guard tests (mocked, no network)
        id: v6_tests
        run: node --test ops/monitor/digest.test.mjs ops/monitor/slack-digest-adapter.test.mjs ops/monitor/architecture-guard.test.mjs
      # V5 incident delivery — LIVE (owner-approved 2026-08-19). Computes
      # CREATE/UPDATE/RESOLVE/NONE from runtime-health.json and delivers real GitHub
      # Issues ONLY for NEW CRITICAL runtime alerts. Deduplicated (local state seeded
      # above + GitHub-side title lookup fallback). Best-effort/fail-safe: a transport
      # failure surfaces INCIDENT_DELIVERY_FAILED but never crashes the run or suppresses
      # evidence. At a HEALTHY baseline there are no critical alerts => ZERO issue writes.
      # To revert to dry-run: set OPS_ALERT_DRY_RUN 'true' (or OPS_INCIDENT_DELIVERY_ENABLED 'false').
      - name: Incident delivery (LIVE — real GitHub Issues for NEW CRITICAL only)
        id: incident_delivery
        if: always()
        continue-on-error: true
        env:
          OPS_ALERT_DRY_RUN: 'false'
          OPS_INCIDENT_DELIVERY_ENABLED: 'true'
          GH_TOKEN: ${{ github.token }} # issue create/comment/close + dedup lookup (issues:write)
          OPS_STATE_SEED_STATUS: ${{ steps.seed_state.outputs.seed_status }}
          OPS_STATE_SEED_SOURCE_RUN: ${{ steps.seed_state.outputs.source_run }}
        run: node ops/monitor/incident-delivery.mjs
      # Daily digest — rolling 24h summary, delivered to Slack (V7). ARMED:
      # OPS_DIGEST_DELIVERY_ENABLED=true, OPS_DIGEST_DRY_RUN=false. The webhook comes ONLY
      # from the OPS_SLACK_WEBHOOK_URL secret, injected ONLY into this step (never job-wide,
      # never a YAML literal, never logged). If the secret is ABSENT the adapter reports
      # NOT_CONFIGURED → 0 messages and the workflow stays GREEN (no per-run failure).
      # Deterministic once-per-UTC-day eligibility guarantees at most ONE Slack message/day.
      # Slack is the DAILY DIGEST channel ONLY — CRITICAL incidents stay on GitHub Issues.
      - name: Daily digest (Slack delivery; NOT_CONFIGURED-safe)
        id: digest
        if: always()
        continue-on-error: true
        env:
          OPS_DIGEST_DELIVERY_ENABLED: 'true'
          OPS_DIGEST_DRY_RUN: 'false'
          SLACK_WEBHOOK_URL: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then echo "Slack webhook configured: YES"; else echo "Slack webhook configured: NO"; fi
          node ops/monitor/digest.mjs
      - name: Ops Console + actionable run summary (metadata only)
        id: ops_console
        if: always()
        run: node ops/monitor/ops-console.mjs
      - name: Release readiness (informational — NOT READY does NOT fail this workflow)
        id: readiness
        # Observability health != product release readiness. exit 0=READY, 1=NOT READY
        # (a valid verdict — informational here), 2=execution error (a REAL failure).
        run: |
          set +e
          node ops/monitor/preflight.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "readiness=READY" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "readiness=NOT READY" >> "$GITHUB_OUTPUT"
            echo "::notice::Release readiness = NOT READY (informational; does not fail the observability workflow)."
          else
            echo "readiness=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "::error::Release preflight execution error (exit $code) — this IS an observability failure."
            exit "$code"
          fi
      # NOTE (V6): the legacy alert.mjs GitHub-Issue writer has been RETIRED. There is
      # now exactly ONE production operational Issue writer — the V5 incident pipeline
      # above. The component-DOWN signal alert.mjs used to raise is delivered through it
      # as SERVICE_COMPONENT_DOWN. No separate "Alert on live DOWN" step exists anymore.
      - name: Upload health snapshot + events (artifact, not committed)
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-status
          path: |
            ops-status/latest.json
            ops-status/runtime-health.json
            ops-status/runtime-health.md
            ops-status/ops-console.md
            ops-status/incident-actions.json
            ops-status/incident-state.json
            ops-status/trend.json
            ops-status/daily-digest.md
            ops-status/daily-digest.json
            ops-status/daily-digest-preview.md
            ops-status/digest-state.json
            ops-status/digest-delivery.json
            ops-status/events/
            ops-status/runtime-events/
          retention-days: 14
      # FINAL step — derives its verdict from the REAL outcomes of the steps above
      # (never hardcoded). Runs after the artifact upload so it can report it truthfully.
      - name: Ops run summary (observability execution vs release readiness — no PII)
        if: always()
        env:
          OBS_OK: ${{ steps.checks.outcome == 'success' && steps.engine_tests.outcome == 'success' && steps.alert_tests.outcome == 'success' && steps.preflight_tests.outcome == 'success' && steps.postgres_tests.outcome == 'success' && steps.runtimelog_tests.outcome == 'success' && steps.evaluator_tests.outcome == 'success' && steps.incident_tests.outcome == 'success' && steps.v6_tests.outcome == 'success' && steps.readiness.outcome == 'success' && steps.artifact.outcome == 'success' }}
          READINESS: ${{ steps.readiness.outputs.readiness }}
          ART_OUTCOME: ${{ steps.artifact.outcome }}
          RTLOG_STATUS: ${{ steps.runtime_logs.outputs.status }}
          RTLOG_EVENTS: ${{ steps.runtime_logs.outputs.events }}
        run: |
          if [ "$OBS_OK" = "true" ]; then OBS="SUCCESS"; else OBS="FAILURE"; fi
          {
            echo "## Feedback2Me Ops — run summary"
            echo ""
            echo "- **Observability execution:** $OBS  _(monitor=${{ steps.checks.outcome }}, engine-tests=${{ steps.engine_tests.outcome }}, alert-tests=${{ steps.alert_tests.outcome }}, preflight-tests=${{ steps.preflight_tests.outcome }}, evaluator-tests=${{ steps.evaluator_tests.outcome }}, incident-tests=${{ steps.incident_tests.outcome }}, v6-tests=${{ steps.v6_tests.outcome }}, readiness=${{ steps.readiness.outcome }}, artifact=$ART_OUTCOME)_"
            echo "- **Incident delivery:** LIVE (delivery=${{ steps.incident_delivery.outcome }}, console=${{ steps.ops_console.outcome }}) — single canonical writer; see the Ops Console section for mode/health and issue writes."
            echo "- **Release readiness:** ${READINESS:-UNKNOWN}  _(does not affect observability execution)_"
            echo "- **Artifact upload:** $ART_OUTCOME"
            echo "- **Runtime-log collector:** ${RTLOG_STATUS:-UNKNOWN} (Railway backend); runtime events collected this run: ${RTLOG_EVENTS:-0}. _Collector state is separate from backend health — a collector failure is NOT a backend outage._"
            if [ -f ops-status/latest.json ]; then
              node -e "const s=require('./ops-status/latest.json');const down=Object.values(s.components||{}).filter(c=>c.status==='DOWN').length;const oi=(s.incidents||[]).filter(i=>i.status==='OPEN').length;console.log('- **Live component DOWN:** '+down+' _(delivered as SERVICE_COMPONENT_DOWN via the V5 pipeline)_  ·  **Snapshot open incidents:** '+oi+'  ·  **Overall:** '+s.overall);"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Observability execution: $OBS"
          if [ "$OBS" != "SUCCESS" ]; then
            echo "::error::Observability execution FAILURE — see step outcomes above."
            exit 1
          fi
