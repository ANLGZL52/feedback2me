name: Ops Health (read-only)

# App-independent observability. Runs PRODUCTION-SAFE READ-ONLY checks + release
# preflight. NEVER deploys, NEVER writes to production, NEVER runs synthetic
# purchases or touches user data. Results are uploaded as artifacts (NOT committed
# every run, to avoid repo bloat — Phase 19).
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # every 30 min; adjust as needed
  # NOTE: no push trigger — this is monitoring, not a build gate.

permissions:
  contents: read
  actions: read
  issues: write # for the spam-safe P0/DOWN alert (ops/monitor/alert.mjs)
  id-token: write # OIDC token for GCP Workload Identity Federation (read-only Cloud Logging); no static keys

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Dedicated read-only Postgres observability credential (NOT the app DATABASE_URL).
    # Absent -> the probe reports UNKNOWN/NO_CREDENTIAL and this workflow stays SUCCESS.
    # Masked by Actions; never echoed, never written to the summary/artifact.
    env:
      OPS_POSTGRES_DATABASE_URL: ${{ secrets.OPS_POSTGRES_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install ops Postgres driver (only when the direct probe is configured)
        if: env.OPS_POSTGRES_DATABASE_URL != ''
        run: npm --prefix ops install --no-audit --no-fund
      - name: Run read-only health checks
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          # FIREBASE_WEB_API_KEY optional; defaults to the public web key already in web_static/f.html
        run: node ops/monitor/run.mjs
      # Short-lived GCP credential via Workload Identity Federation (NO static key,
      # NO stored token). Runs ONLY when the (non-secret) WIF repo variables are set,
      # and ONLY authorizes because the WIF provider trusts this repo on ref=main.
      # A failure here is non-fatal: the collector then reports NOT_CONFIGURED.
      - name: GCP auth (WIF, read-only Cloud Logging — no static credentials)
        id: gcp_auth
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          # Least-privilege scope: read Cloud Logging only.
          access_token_scopes: https://www.googleapis.com/auth/logging.read
          access_token_lifetime: 300s
      - name: Collect runtime logs (Railway + GCP; read-only; NOT_CONFIGURED without creds)
        id: runtime_logs
        # continue-on-error: a collector/auth failure is NOT a backend outage and must
        # not fail the observability workflow. Missing token -> UNKNOWN/NOT_CONFIGURED.
        continue-on-error: true
        env:
          OPS_RAILWAY_TOKEN: ${{ secrets.OPS_RAILWAY_TOKEN }}
          # Ephemeral WIF access token (empty when WIF not configured/authorized) — the
          # GCP collector treats an empty token as NOT_CONFIGURED. Never persisted/printed.
          GCP_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: node ops/monitor/collect-runtime.mjs
      - name: Evaluate runtime health V3 (metrics -> SLO -> alerts -> release gate)
        id: evaluate_runtime
        # continue-on-error: the evaluator must PRODUCE evidence even when the system
        # is UNHEALTHY. A non-zero exit here would suppress the artifact/report, which
        # is the opposite of what monitoring needs. RUNTIME UNHEALTHY != COLLECTOR FAILED.
        continue-on-error: true
        run: node ops/monitor/evaluate-runtime.mjs
      - name: Ops engine self-tests
        id: engine_tests
        run: node --test ops/monitor/engine.test.mjs
      - name: Ops alert-calibration tests (runtime-only alerting)
        id: alert_tests
        run: node --test ops/monitor/alert.test.mjs
      - name: Ops preflight semantics tests (observability vs release readiness)
        id: preflight_tests
        run: node --test ops/monitor/preflight.test.mjs
      - name: Ops postgres-probe tests (sanitized; no real DB)
        id: postgres_tests
        run: node --test ops/monitor/checks/postgres-direct.test.mjs
      - name: Ops runtime-log collector tests (redaction/normalization; no network)
        id: runtimelog_tests
        run: node --test ops/monitor/checks/railway-runtime-logs.test.mjs ops/monitor/checks/railway-http-logs.test.mjs ops/monitor/checks/gcp-functions-logs.test.mjs
      - name: Ops V3 evaluator tests (SLO/alerts/release-gate/money-safety; fixtures, no network)
        id: evaluator_tests
        run: node --test ops/monitor/evaluate-runtime.test.mjs
      - name: Release readiness (informational — NOT READY does NOT fail this workflow)
        id: readiness
        # Observability health != product release readiness. exit 0=READY, 1=NOT READY
        # (a valid verdict — informational here), 2=execution error (a REAL failure).
        run: |
          set +e
          node ops/monitor/preflight.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "readiness=READY" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "readiness=NOT READY" >> "$GITHUB_OUTPUT"
            echo "::notice::Release readiness = NOT READY (informational; does not fail the observability workflow)."
          else
            echo "readiness=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "::error::Release preflight execution error (exit $code) — this IS an observability failure."
            exit "$code"
          fi
      - name: Alert on live DOWN (best-effort; DOWN-only, never release/readiness blockers)
        id: alert
        if: always()
        # continue-on-error: alert DELIVERY failure is best-effort (non-blocking) but
        # its true outcome is preserved in steps.alert.outcome for honest reporting.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ops/monitor/alert.mjs
      - name: Upload health snapshot + events (artifact, not committed)
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-status
          path: |
            ops-status/latest.json
            ops-status/runtime-health.json
            ops-status/runtime-health.md
            ops-status/events/
            ops-status/runtime-events/
          retention-days: 14
      # FINAL step — derives its verdict from the REAL outcomes of the steps above
      # (never hardcoded). Runs after the artifact upload so it can report it truthfully.
      - name: Ops run summary (observability execution vs release readiness — no PII)
        if: always()
        env:
          OBS_OK: ${{ steps.checks.outcome == 'success' && steps.engine_tests.outcome == 'success' && steps.alert_tests.outcome == 'success' && steps.preflight_tests.outcome == 'success' && steps.postgres_tests.outcome == 'success' && steps.runtimelog_tests.outcome == 'success' && steps.evaluator_tests.outcome == 'success' && steps.readiness.outcome == 'success' && steps.artifact.outcome == 'success' }}
          READINESS: ${{ steps.readiness.outputs.readiness }}
          ART_OUTCOME: ${{ steps.artifact.outcome }}
          ALERT_OUTCOME: ${{ steps.alert.outcome }}
          RTLOG_STATUS: ${{ steps.runtime_logs.outputs.status }}
          RTLOG_EVENTS: ${{ steps.runtime_logs.outputs.events }}
        run: |
          if [ "$OBS_OK" = "true" ]; then OBS="SUCCESS"; else OBS="FAILURE"; fi
          # Alert delivery is best-effort; report its true outcome honestly.
          alertDelivery="$ALERT_OUTCOME"
          {
            echo "## Feedback2Me Ops — run summary"
            echo ""
            echo "- **Observability execution:** $OBS  _(monitor=${{ steps.checks.outcome }}, engine-tests=${{ steps.engine_tests.outcome }}, alert-tests=${{ steps.alert_tests.outcome }}, preflight-tests=${{ steps.preflight_tests.outcome }}, readiness=${{ steps.readiness.outcome }}, artifact=$ART_OUTCOME)_"
            echo "- **Release readiness:** ${READINESS:-UNKNOWN}  _(does not affect observability execution)_"
            echo "- **Artifact upload:** $ART_OUTCOME"
            echo "- **Runtime-log collector:** ${RTLOG_STATUS:-UNKNOWN} (Railway backend); runtime events collected this run: ${RTLOG_EVENTS:-0}. _Collector state is separate from backend health — a collector failure is NOT a backend outage._"
            if [ -f ops-status/latest.json ]; then
              node -e "const s=require('./ops-status/latest.json');const down=Object.values(s.components||{}).filter(c=>c.status==='DOWN').length;const oi=(s.incidents||[]).filter(i=>i.status==='OPEN').length;const bl=(s.blockers||[]).filter(b=>b.releaseBlocking);const p0=bl.filter(b=>b.severity==='P0').length,p1=bl.filter(b=>b.severity==='P1').length;const ad=process.env.ALERT_OUTCOME==='failure'?'BEST-EFFORT FAILURE':(down===0&&oi===0?'NO ALERT REQUIRED':'ALERT DELIVERED/UPDATED');console.log('- **Live DOWN:** '+down+'  ·  **Open incidents:** '+oi+'  ·  **Overall:** '+s.overall);console.log('- **Alert delivery:** '+ad);console.log('- **Release blockers:** P0='+p0+' P1='+p1+'  (P0 in this lightweight runner are CI-evidence gaps, not runtime outages)');"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Observability execution: $OBS"
          if [ "$OBS" != "SUCCESS" ]; then
            echo "::error::Observability execution FAILURE — see step outcomes above."
            exit 1
          fi
