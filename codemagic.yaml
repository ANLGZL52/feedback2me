# Codemagic — Flutter iOS (ve isteğe bağlı Android) derlemesi
# Kurulum: https://docs.codemagic.io/flutter-configuration/flutter-projects/
#
# Codemagic panelinde yapılacaklar:
# 1) App → Environment variables: App Store Connect API key veya Apple Developer entegrasyonu
# 2) iOS code signing (manuel): Codemagic Settings → Code signing identities:
#    - iOS certificates: Distribution .p12 (+ şifre)
#    - iOS provisioning profiles: App Store .mobileprovision (Bundle ID: com.anlgzl.feedback2meapp)
# 3) İsterseniz "Variable groups" ile BUNDLE_ID vb. paylaşın
#
# BUNDLE_ID, Xcode ile aynı: com.anlgzl.feedback2meapp (ios/Runner)

workflows:
  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Otomatik seçim (distribution_type) YANLIŞ sertifikayı (revoke 1B17) yüklüyordu.
      # Bunun yerine, Codemagic Code signing identities'e yüklenen GEÇERLİ sertifikayı
      # ADIYLA açıkça referansla → yalnızca o (fb2me_2026son = 3B685214..., exp
      # 2027-08-18) keychain'e yüklenir. NOT: referans kullanınca distribution_type +
      # bundle_identifier KULLANILAMAZ. Provisioning profilini script içinde App Store
      # Connect'ten (list-profiles) çekiyoruz.
      ios_signing:
        certificates:
          - fb2me_2026son
      vars:
        BUNDLE_ID: com.anlgzl.feedback2meapp
        # Xcode 26+ altool: bundle id → App Store uygulama ID eşlemesi bazen başarısız olur.
        # App Store Connect → Uygulama → Genel → App Information → "Apple ID" (sayı, örn. 6762295382)
        # Kendi ID’nizi yazın; yanlışsa yükleme yine düşer.
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6762295382"
      # Panelden "Variable group" ekleyebilirsiniz; örnek isim:
      # groups:
      #   - ios_signing
    # Team integrations → App Store Connect’te verdiğiniz ad ile aynı olmalı (ör. feedback2me).
    integrations:
      app_store_connect: feedback2me
    scripts:
      - name: Flutter bağımlılıkları
        script: |
          set -e
          flutter pub get
      - name: CocoaPods
        script: |
          set -e
          # Podfile ios/ altında; önce flutter pub get Generated.xcconfig üretir.
          test -f ios/Podfile || { echo "ERROR: ios/Podfile eksik — repoya commit edin."; exit 1; }
          cd ios
          pod install
      # Kod imzalama — Codemagic'in ÜRETTİĞİ yeni geçerli sertifikaya sabitlenmiş.
      # Codemagic UI'da (Code signing identities) TAZE bir Apple Distribution
      # sertifikası + özel anahtarı üretildi (serial 3B685214..., exp 2027-08-18);
      # özel anahtar Codemagic Code signing identities'te saklı olduğundan
      # "Set up code signing identities" adımı onu build keychain'ine yükler.
      # Bu certe bağlı ACTIVE App Store profilini (ada göre) indirip uyguluyoruz;
      # eski/revoke profiller devre dışı kalır. use-profiles $HOME/export_options.plist
      # üretir (IPA adımı kullanır).
      - name: Kod imzalama (yeni Codemagic sertifikası + Build21 profili)
        script: |
          set -e
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          rm -f "$PROF_DIR"/*.mobileprovision 2>/dev/null || true
          # Yalnızca yeni certe bağlı profili indir (ada göre) → deterministik.
          app-store-connect list-profiles \
            --type IOS_APP_STORE \
            --state ACTIVE \
            --name "Feedback2Me AppStore Build21" \
            --profiles-dir "$PROF_DIR" \
            --save
          echo "=== keychain imza kimlikleri ==="
          security find-identity -v -p codesigning || true
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --code-signing-setup-verbose-logging
      - name: IPA derle
        script: |
          set -e
          # use-profiles genelde $HOME/export_options.plist üretir; verilmezse export "provisioning profile" hatası verir.
          if [ -f "$HOME/export_options.plist" ]; then
            flutter build ipa --release --export-options-plist="$HOME/export_options.plist"
          else
            echo "WARN: $HOME/export_options.plist yok, doğrudan flutter build ipa deneniyor."
            flutter build ipa --release
          fi
          # .ipa yoksa Publishing "No artifacts" der; hatayı burada net göster.
          if ! compgen -G "build/ios/ipa/*.ipa" > /dev/null; then
            echo "ERROR: build/ios/ipa/*.ipa bulunamadı (export/imza/bundle id kontrol edin)."
            find build/ios -name "*.ipa" 2>/dev/null || true
            ls -la build/ios/ipa 2>/dev/null || true
            exit 1
          fi
          ls -la build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/**
      - /tmp/xcodebuild_logs/*.log
    # Mac/Transporter olmadan: build sonrası IPA App Store Connect’e gider → TestFlight’ta görünür.
    # API anahtarı: App Manager (veya Admin). integration adı yukarıdaki app_store_connect ile aynı olmalı.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Auto-distribute the processed build to the existing INTERNAL group.
        # Internal testing needs NO App Review. Do NOT add external groups here.
        beta_groups:
          - deneme

  # İmzasız veya yalnızca derleme testi için basit iş akışı (CI smoke):
  ios-debug-build:
    name: iOS Debug (imza gerektirmez — yalnızca derleme doğrulama)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get + iOS build (no codesign)
        script: |
          set -e
          flutter pub get
          cd ios && pod install && cd ..
          flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
